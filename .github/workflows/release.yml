name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm CLI is used for publishing (registry auth via NODE_AUTH_TOKEN)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        run: |
          pkg_version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          if [ "v${pkg_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${pkg_version}"
            exit 1
          fi

      - name: Install dependencies (all platforms' native packages)
        run: |
          bun install --frozen-lockfile
          bun install --os="*" --cpu="*"

      - name: Test and typecheck
        run: |
          bun test
          bunx tsc --noEmit

      - name: Build binaries
        run: bun run scripts/build.ts

      - name: Package npm + release artifacts
        run: bun run scripts/package.ts

      - name: Build Python wheels
        run: python3 scripts/build_wheels.py

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          generate_release_notes: true

      - name: Publish platform packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in dist/npm/*/; do
            name="$(basename "$dir")"
            [ "$name" = "timeman" ] && continue
            (cd "$dir" && npm publish --access public --provenance)
          done

      - name: Publish main package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd dist/npm/timeman && npm publish --access public --provenance

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
          password: ${{ secrets.PYPI_TOKEN }}
